spring.datasource.url=jdbc:h2:mem:versioncontrol_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
jwt.expiration=PT15M
auth.refresh-token-ttl=PT720H
auth.refresh-token-replay-retention=PT720H
auth.cookie.name=DEVHUB_REFRESH
auth.cookie.path=/api/auth
auth.cookie.secure=false
auth.cookie.same-site=Lax
auth.frontend-origins=http://localhost:3000
auth.session-cleanup-delay-ms=21600000
version-control.storage.root=${java.io.tmpdir}/version-control-test-storage
